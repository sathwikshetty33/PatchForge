name: patchforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patchforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchforge}
      POSTGRES_DB: ${POSTGRES_DB:-patchforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patchforge} -d ${POSTGRES_DB:-patchforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  insights:
    build:
      context: ./insights
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-patchforge}:${POSTGRES_PASSWORD:-patchforge}@postgres:5432/${POSTGRES_DB:-patchforge}?sslmode=disable
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      TEMPERATURE: ${TEMPERATURE:-0.2}
      MAX_TOKENS: ${MAX_TOKENS:-1500}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
    ports:
      - "${INSIGHTS_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  core:
    build:
      context: ./core
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-patchforge}:${POSTGRES_PASSWORD:-patchforge}@postgres:5432/${POSTGRES_DB:-patchforge}?sslmode=disable
      INSIGHTS_GRPC_ADDR: insights:50051
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      HASH_KEY: ${HASH_KEY:?set HASH_KEY in .env}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GIN_MODE: ${GIN_MODE:-release}
    ports:
      - "${CORE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      insights:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      VITE_APP_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      VITE_APP_GITHUB_REDIRECT_URI: ${VITE_APP_GITHUB_REDIRECT_URI:-http://localhost:3000/auth/github/callback}
    # Port 3000 is the origin allowed by the Go server's CORS middleware.
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - core

volumes:
  postgres-data:
