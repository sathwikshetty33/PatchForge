[project]
name = "insights"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.31.1",
    "grpcio>=1.74.0",
    "grpcio-tools>=1.74.0",
    "langchain>=0.3.27",
    "langchain-community>=0.3.29",
    "langchain-groq>=0.3.8",
    "load-dotenv>=0.1.0",
    "psycopg2-binary>=2.9.11",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.43",
]

[tool.ruff]
target-version = "py312"
line-length = 120
# Generated protobuf stubs and the virtualenv are not ours to lint.
extend-exclude = ["grpc_files", ".venv"]

[tool.ruff.lint]
# pycodestyle errors + pyflakes: catches real breakage (undefined names,
# syntax errors, unused imports) without demanding a codebase-wide restyle.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # The service modules intentionally re-export via `from utils.utils import *`.
    "F403",
    "F405",
    # server.py must run sys.path.append() before importing grpc_files/utils.
    "E402",
]
